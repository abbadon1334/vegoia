name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

# A new push supersedes whatever was still running for the same ref.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  static:
    name: Static analysis
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: '8.5'
          coverage: none
          tools: composer:v2

      - name: Install dependencies
        uses: ramsey/composer-install@v3

      - name: Formatting
        run: vendor/bin/pint --test

      - name: PHPStan
        run: vendor/bin/phpstan analyse --no-progress --error-format=github

  tests:
    name: Tests (${{ matrix.dependencies }} dependencies)
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        # Lowest catches a constraint that is looser than what the code needs;
        # highest catches a dependency that moved under us.
        dependencies: [lowest, highest]
    steps:
      - uses: actions/checkout@v4

      - name: Set up PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: '8.5'
          coverage: none
          tools: composer:v2

      - name: Install dependencies
        uses: ramsey/composer-install@v3
        with:
          dependency-versions: ${{ matrix.dependencies }}

      - name: PHPUnit
        run: vendor/bin/phpunit --colors=always

  jit:
    name: JIT consistency
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      # The tracing JIT is a process-level setting, so a difference between it
      # and the interpreter is invisible to PHPUnit from inside one process.
      # It has already produced a wrong Leiden partition once in this project,
      # on the same seed, which is why this is a required check and not a
      # nicety.
      - name: Set up PHP with opcache
        uses: shivammathur/setup-php@v2
        with:
          php-version: '8.5'
          coverage: none
          extensions: opcache
          ini-values: opcache.enable_cli=1, opcache.jit=tracing, opcache.jit_buffer_size=128M

      - name: Install dependencies
        uses: ramsey/composer-install@v3

      - name: Results must not depend on the JIT
        run: php tools/jit_check.php

      - name: Tests under the JIT
        run: php -d opcache.enable_cli=1 -d opcache.jit=tracing -d opcache.jit_buffer_size=128M vendor/bin/phpunit --colors=always

  coverage:
    name: Coverage
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up PHP with pcov
        uses: shivammathur/setup-php@v2
        with:
          php-version: '8.5'
          coverage: pcov
          tools: composer:v2

      - name: Install dependencies
        uses: ramsey/composer-install@v3

      - name: PHPUnit with coverage
        run: vendor/bin/phpunit --coverage-clover=coverage.xml --coverage-text --colors=always

      - name: Store the report
        uses: actions/upload-artifact@v4
        with:
          name: coverage
          path: coverage.xml
          retention-days: 14

  fixtures:
    name: Fixtures are reproducible
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Set up PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: '8.5'
          coverage: none
          tools: composer:v2

      - uses: ramsey/composer-install@v3

      # The committed fixtures, and the accuracy ceilings measured from
      # numpy, are the reference every numeric test is checked against. If
      # regenerating them from networkx, igraph and leidenalg does not
      # reproduce them, they are not a reference -- they are a snapshot of one
      # machine.
      #
      # "Reproduce" cannot mean byte for byte, though that is what this job
      # asked for first, and it failed: every difference was one or two units
      # in the last place, the signature of the same sum taken in a different
      # order on a different CPU. See tools/compare_fixtures.py for the full
      # reasoning and the tolerances. Structure is still compared exactly.
      #
      # Deliberately unpinned. Pinning would make this job quieter and stop it
      # doing its job: it exists to notice when a reference library changes
      # its answer, and a pin hides exactly that.
      - name: Install the reference stack
        run: pip install numpy scipy scikit-learn networkx python-igraph leidenalg mpmath statsmodels

      - name: Record which versions produced this run
        run: pip list --format=freeze | grep -E '^(numpy|scipy|scikit-learn|networkx|igraph|leidenalg|mpmath|statsmodels)='

      - name: Keep the committed fixtures to compare against
        run: cp -r resources/fixtures "${RUNNER_TEMP}/fixtures-committed"

      - name: Regenerate
        run: |
          python3 tools/generate_graph_fixtures.py resources/fixtures/graph
          python3 tools/generate_directed_fixtures.py resources/fixtures/directed
          python3 tools/generate_agreement_fixtures.py
          python3 tools/generate_correlation_fixtures.py
          python3 tools/generate_variance_stress.py
          python3 tools/generate_nist_attainable.py
          python3 tools/generate_lls_attainable.py
          python3 tools/generate_anova_attainable.py
          python3 tools/generate_special_function_fixtures.py
          python3 tools/generate_distribution_fixtures.py
          python3 tools/generate_inference_fixtures.py
          python3 tools/generate_link_prediction_fixtures.py
          python3 tools/generate_structure_fixtures.py
          python3 tools/generate_label_propagation_fixtures.py

      - name: The references must still give the same answers
        run: python3 tools/compare_fixtures.py "${RUNNER_TEMP}/fixtures-committed" resources/fixtures

      # The check with teeth, and the reason the exemptions above are not
      # loopholes. Whatever drifted -- a partition leidenalg found in a
      # different random order, an accuracy ceiling that follows this runner's
      # LAPACK rather than the machine the fixtures were committed from -- the
      # library must still satisfy the references as regenerated here. That is
      # a stronger question than whether the files came back identical, and
      # unlike file equality it is a question about this library.
      - name: The library must satisfy the references it just regenerated
        run: vendor/bin/phpunit --colors=always

  mutation:
    name: Mutation testing
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          # Infection compares against a base commit when asked to; the full
          # history is cheap here and saves a second fetch if that is ever
          # turned on.
          fetch-depth: 0

      - name: Set up PHP with pcov
        uses: shivammathur/setup-php@v2
        with:
          php-version: '8.5'
          coverage: pcov
          tools: composer:v2

      - uses: ramsey/composer-install@v3

      # Coverage answers which lines ran; this answers whether anything would
      # have complained had they been wrong. The two come apart more often
      # than is comfortable, and they came apart in this repository: the JIT
      # guard covered its lines, passed, and missed a defect that made Surprise
      # count 105 edges on a 78-edge graph.
      #
      # The threshold is measured, not aspired to: 83.23% is what the suite
      # reaches, and 83 is that rounded down so ordinary variation between runs
      # does not fail the build while a real weakening does. Every line of the
      # library is reachable by some test -- mutation code coverage is 100% --
      # so the number is entirely about whether the assertions notice, not
      # about what is exercised.
      #
      # Raise it when the score rises. Lowering it is a decision, not a fix.
      - name: Infection
        run: |
          vendor/bin/infection \
            --threads=max \
            --no-interaction \
            --no-progress \
            --only-covering-test-cases \
            --show-mutations=0 \
            --min-msi=83 \
            --min-covered-msi=83

      - name: Summary
        if: always()
        run: cat build/infection/summary.log || true

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: infection-report
          path: build/infection/
          retention-days: 7
