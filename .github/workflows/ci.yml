name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

# A new push supersedes whatever was still running for the same ref.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  static:
    name: Static analysis
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: '8.5'
          coverage: none
          tools: composer:v2

      - name: Install dependencies
        uses: ramsey/composer-install@v3

      - name: Formatting
        run: vendor/bin/pint --test

      - name: PHPStan
        run: vendor/bin/phpstan analyse --no-progress --error-format=github

  tests:
    name: Tests (${{ matrix.dependencies }} dependencies)
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        # Lowest catches a constraint that is looser than what the code needs;
        # highest catches a dependency that moved under us.
        dependencies: [lowest, highest]
    steps:
      - uses: actions/checkout@v4

      - name: Set up PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: '8.5'
          coverage: none
          tools: composer:v2

      - name: Install dependencies
        uses: ramsey/composer-install@v3
        with:
          dependency-versions: ${{ matrix.dependencies }}

      - name: PHPUnit
        run: vendor/bin/phpunit --colors=always

  jit:
    name: JIT consistency
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      # The tracing JIT is a process-level setting, so a difference between it
      # and the interpreter is invisible to PHPUnit from inside one process.
      # It has already produced a wrong Leiden partition once in this project,
      # on the same seed, which is why this is a required check and not a
      # nicety.
      - name: Set up PHP with opcache
        uses: shivammathur/setup-php@v2
        with:
          php-version: '8.5'
          coverage: none
          extensions: opcache
          ini-values: opcache.enable_cli=1, opcache.jit=tracing, opcache.jit_buffer_size=128M

      - name: Install dependencies
        uses: ramsey/composer-install@v3

      - name: Results must not depend on the JIT
        run: php tools/jit_check.php

      - name: Tests under the JIT
        run: php -d opcache.enable_cli=1 -d opcache.jit=tracing -d opcache.jit_buffer_size=128M vendor/bin/phpunit --colors=always

  coverage:
    name: Coverage
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up PHP with pcov
        uses: shivammathur/setup-php@v2
        with:
          php-version: '8.5'
          coverage: pcov
          tools: composer:v2

      - name: Install dependencies
        uses: ramsey/composer-install@v3

      - name: PHPUnit with coverage
        run: vendor/bin/phpunit --coverage-clover=coverage.xml --coverage-text --colors=always

      - name: Store the report
        uses: actions/upload-artifact@v4
        with:
          name: coverage
          path: coverage.xml
          retention-days: 14

  fixtures:
    name: Fixtures are reproducible
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      # The committed fixtures, and the accuracy ceilings measured from numpy,
      # are the reference every numeric test is checked against. If regenerating them from networkx, igraph and leidenalg does
      # not reproduce them byte for byte, they are not a reference -- they are
      # a snapshot of one machine. This has already been wrong once: Python
      # randomises string hashing per process, which reordered the sums behind
      # harmonic centrality and moved its last bit.
      - name: Install the reference stack
        run: pip install --quiet numpy scipy scikit-learn networkx python-igraph leidenalg

      - name: Regenerate
        run: |
          python3 tools/generate_graph_fixtures.py resources/fixtures/graph
          python3 tools/generate_directed_fixtures.py resources/fixtures/directed
          python3 tools/generate_agreement_fixtures.py
          python3 tools/generate_correlation_fixtures.py
          python3 tools/generate_variance_stress.py
          python3 tools/generate_nist_attainable.py
          python3 tools/generate_lls_attainable.py
          python3 tools/generate_anova_attainable.py

      - name: Nothing may have changed
        run: |
          if ! git diff --quiet; then
            echo "::error::Regenerating the fixtures changed them. They are not reproducible."
            git diff --stat
            git diff | head -60
            exit 1
          fi
          echo "Fixtures reproduce byte for byte."
